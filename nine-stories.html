<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nine Stories - J.D. Salinger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&amp;family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "on-primary": "#ffffff",
                "inverse-surface": "#323127",
                "secondary": "#56650d",
                "inverse-on-surface": "#f6f1e2",
                "inverse-primary": "#ffb597",
                "on-secondary": "#ffffff",
                "surface-variant": "#e7e2d4",
                "on-error": "#ffffff",
                "on-tertiary-fixed": "#2a1700",
                "on-primary-container": "#fffbff",
                "on-tertiary-fixed-variant": "#653e00",
                "on-tertiary": "#ffffff",
                "surface-container-highest": "#e7e2d4",
                "primary": "#a13b00",
                "secondary-fixed-dim": "#becf6e",
                "tertiary-fixed": "#ffddb8",
                "secondary-fixed": "#daeb87",
                "on-surface-variant": "#584239",
                "surface-tint": "#a53d00",
                "on-tertiary-container": "#fffbff",
                "outline-variant": "#dfc0b4",
                "outline": "#8b7167",
                "on-primary-fixed": "#360f00",
                "on-secondary-fixed": "#181e00",
                "on-primary-fixed-variant": "#7e2c00",
                "on-secondary-container": "#5b6912",
                "surface-container": "#f3eedf",
                "surface-dim": "#dedacb",
                "tertiary": "#825100",
                "surface-container-low": "#f8f3e4",
                "primary-container": "#c45014",
                "tertiary-fixed-dim": "#ffb95f",
                "surface-bright": "#fef9ea",
                "surface-container-high": "#ede8d9",
                "primary-fixed-dim": "#ffb597",
                "on-surface": "#1d1c13",
                "on-secondary-fixed-variant": "#404c00",
                "primary-fixed": "#ffdbcd",
                "error": "#ba1a1a",
                "on-background": "#1d1c13",
                "on-error-container": "#93000a",
                "surface-container-lowest": "#ffffff",
                "secondary-container": "#d7e985",
                "surface": "#fef9ea",
                "tertiary-container": "#a36700",
                "error-container": "#ffdad6",
                "background": "#fef9ea"
            },
            "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
            },
            "spacing": {
                "margin-mobile": "20px",
                "unit": "4px",
                "margin-desktop": "48px",
                "grid-columns": "12",
                "gutter": "16px"
            },
            "fontFamily": {
                "body-lg": ["Libre Caslon Text"],
                "label-caps": ["Libre Caslon Text"],
                "body-md": ["Libre Caslon Text"],
                "headline-md": ["Bodoni Moda"],
                "display-lg": ["Bodoni Moda"],
                "headline-lg-mobile": ["Bodoni Moda"],
                "headline-lg": ["Bodoni Moda"]
            },
            "fontSize": {
                "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                "label-caps": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                "headline-md": ["28px", {"lineHeight": "1.3", "fontWeight": "500"}],
                "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "headline-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                "headline-lg": ["40px", {"lineHeight": "1.2", "fontWeight": "600"}]

          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .book-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 48px;
        border: 1px solid #1d1c13;
        background-color: #fef9ea;
      }
      .grid-border {
        border: 1px solid #1d1c13;
      }
      .editorial-line {
        height: 1px;
        background-color: #1d1c13;
        width: 100%;
      }
      .vertical-line {
        width: 1px;
        background-color: #1d1c13;
        height: 100%;
      }
    </style>
</head>
<body class="bg-surface-dim min-h-screen flex items-center justify-center py-12 px-4">
<!-- Main Book Cover Surface -->
<main class="book-container shadow-2xl relative">
<!-- Book Identity Header -->
<header class="flex flex-col items-center justify-center pt-8 pb-16">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2 leading-none">Nine Stories</h1>
<div class="flex items-center gap-4 py-2">
<span class="font-label-caps text-label-caps text-on-surface">BY</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">J.D. Salinger</h2>
</header>
<!-- The 3x3 Master Grid Structure -->
<div class="w-full grid-border overflow-hidden">
<div class="grid grid-cols-3 aspect-[3/4] md:aspect-square">
<!-- ROW 1 -->
<!-- A PERFECT DAY FOR BANANAFISH -->
<div class="border-r border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-primary-container rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-primary-container leading-tight">A PERFECT DAY FOR BANANAFISH</p>
</div>
</div>
<!-- UNCLE WIGGILY IN CONNECTICUT -->
<div class="border-r border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-tertiary-container rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-tertiary-container leading-tight">UNCLE WIGGILY IN CONNECTICUT</p>
</div>
</div>
<!-- JUST BEFORE THE WAR WITH THE ESKIMOS -->
<div class="border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-primary rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-primary leading-tight">JUST BEFORE THE WAR WITH THE ESKIMOS</p>
</div>
</div>
<!-- ROW 2 -->
<!-- THE LAUGHING MAN -->
<div class="border-r border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-tertiary rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-tertiary-container leading-tight">THE LAUGHING MAN</p>
</div>
</div>
<!-- DOWN AT THE DINGHY -->
<div class="border-r border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-secondary rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-secondary leading-tight">DOWN AT THE DINGHY</p>
</div>
</div>
<!-- FOR ESME—WITH LOVE AND SQUALOR -->
<div class="border-b border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-primary-container rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-primary-container leading-tight">FOR ESME—WITH LOVE AND SQUALOR</p>
</div>
</div>
<!-- ROW 3 -->
<!-- PRETTY MOUTH AND GREEN MY EYES -->
<div class="border-r border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-primary rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-primary leading-tight">PRETTY MOUTH AND GREEN MY EYES</p>
</div>
</div>
<!-- DE DAUMIER-SMITH’S BLUE PERIOD -->
<div class="border-r border-on-surface p-4 flex items-center justify-center">
<div class="w-full h-full bg-tertiary-container rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-tertiary-container leading-tight">DE DAUMIER-SMITH’S BLUE PERIOD</p>
</div>
</div>
<!-- TEDDY -->
<div class="p-4 flex items-center justify-center">
<div class="w-full h-full bg-secondary-fixed-dim rounded-xl flex items-center justify-center p-4 text-center">
<p class="font-label-caps text-label-caps text-on-secondary-fixed-variant leading-tight">TEDDY</p>
</div>
</div>
</div>
</div>
<!-- Signature Detail (Small text echoing the top of the vintage cover) -->
<div class="absolute top-4 left-4 flex gap-4">
<span class="font-label-caps text-[10px] text-on-surface opacity-60">N5278 * 95c</span>
</div>
<div class="absolute top-4 right-4">
<span class="font-label-caps text-[10px] text-on-surface opacity-60">A BANTAM BOOK</span>
</div>
</main>
</body></html>
